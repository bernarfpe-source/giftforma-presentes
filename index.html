<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Presentes de Natal em 3D | Em breve | GiftForma</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
:root{--verde:#0e3b2e;--verde2:#145242;--ouro:#e2b13c;--creme:#fdf3dc}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0%,var(--verde2),var(--verde) 70%);color:var(--creme);font-family:system-ui,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;text-align:center}
main{max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px}
.logo{width:min(220px,60vw);height:auto}
.treno{width:min(320px,80vw);height:auto;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35));animation:bob 3s ease-in-out infinite}
h1{margin:0;font-size:clamp(28px,6vw,42px);line-height:1.15;text-wrap:balance}
.selo{display:inline-block;background:linear-gradient(#c8222b,#a3141d);color:#fff;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:14px;padding:8px 22px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--ouro)}
p{margin:0;font-size:17px;line-height:1.5;color:#e9dcb8}
a{color:var(--ouro);font-weight:700}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media (prefers-reduced-motion:reduce){.treno{animation:none}}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo-dark.png" alt="GiftForma">
  <img class="treno" src="assets/papai-noel-treno.webp" alt="Papai Noel em seu trenó">
  <span class="selo">Em breve</span>
  <h1>Presentes de Natal em 3D</h1>
  <p>Estamos preparando uma coleção de presentes impressos em 3D. Volte em breve.</p>
  <p>Brindes para empresas: <a href="https://giftforma.com.br">giftforma.com.br</a></p>
</main>
</body>
</html>
